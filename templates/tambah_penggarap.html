<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Jadwal Tontonan</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 550px; margin: 40px auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { font-size: 20px; color: #f8fafc; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #6c5ce7; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: bold; color: #cbd5e1; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; font-size: 14px; color: #f8fafc; box-sizing: border-box; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #6c5ce7; }
        textarea { resize: vertical; height: 90px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 24px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-submit { background-color: #6c5ce7; color: white; }
        .btn-submit:hover { background-color: #5b47db; }
        .btn-cancel { background-color: #334155; color: #cbd5e1; }
        .btn-cancel:hover { background-color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>
        <form method="POST">
            <div class="form-group">
                <label for="nama">Nama Penggarap / Distributor</label>
                <input type="text" name="nama" id="nama" placeholder="Contoh: Bilibili Indonesia" required>
            </div>

            <div class="form-group">
                <label for="deskripsi">Deskripsi</label>
                <textarea name="deskripsi" id="deskripsi" placeholder="Tuliskan deskripsi singkat mengenai distributor ini..."></textarea>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select name="status" id="status" required>
                    <option value="Aktif">Aktif</option>
                    <option value="Nonaktif">Nonaktif</option>
                </select>
            </div>

            <div class="form-group">
                <label for="website">Website Resmi</label>
                <input type="url" name="website" id="website" placeholder="https://www.bilibili.tv">
            </div>

            <div class="form-group">
                <label for="facebook">Link Facebook</label>
                <input type="url" name="facebook" id="facebook" placeholder="https://facebook.com/...">
            </div>

            <div class="form-group">
                <label for="instagram">Link Instagram</label>
                <input type="url" name="instagram" id="instagram" placeholder="https://instagram.com/...">
            </div>

            <div class="form-group">
                <label for="threads">Link Threads</label>
                <input type="url" name="threads" id="threads" placeholder="https://threads.net/...">
            </div>

            <div class="form-group">
                <label for="twitter">Link Twitter (X)</label>
                <input type="url" name="twitter" id="twitter" placeholder="https://twitter.com/...">
            </div>

            <div class="form-group">
                <label for="youtube">Link YouTube</label>
                <input type="url" name="youtube" id="youtube" placeholder="https://youtube.com/...">
            </div>

            <div class="btn-group">
                <a href="/daftar-penggarap" class="btn btn-cancel">Batal</a>
                <button type="submit" class="btn btn-submit">Simpan Penggarap</button>
            </div>
        </form>
    </div>
</body>
</html>
